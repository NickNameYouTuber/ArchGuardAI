version: 1
architecture:
  name: agent-generation-demo
  pattern: clean-architecture-lite
  language: typescript
  framework: nestjs
agents:
  targets:
    - agents
    - cursor
    - claude
    - copilot
layers:
  controller:
    description: HTTP request and response mapping.
    path: src/**/*.controller.ts
    can_call:
      - use_case
    cannot_call:
      - repository
  use_case:
    description: Application use cases.
    path: src/**/*.use-case.ts
    can_call:
      - domain
      - repository_port
  domain:
    description: Pure business rules.
    path: src/domain/**/*.ts
    cannot_import:
      - "@nestjs/*"
      - typeorm
      - src/infrastructure/**
  repository_port:
    description: Application-owned persistence contracts.
    path: src/**/*.repository.port.ts
  repository:
    description: Persistence implementations.
    path: src/**/*.repository.ts
    can_call:
      - domain
      - repository_port
